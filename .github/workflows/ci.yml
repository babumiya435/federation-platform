name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Reads router/rust-toolchain.toml. hive-router's build script runs `npm install`,
      # which the Node setup above provides.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-workspaces: router
      - run: pnpm install --frozen-lockfile
      # TypeScript checks (tests, generated-file drift, composition) and the router's
      # fmt, clippy and unit tests: the same command you run locally.
      - run: pnpm check
