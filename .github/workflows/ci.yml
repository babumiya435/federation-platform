name: ci

# No path filters on purpose: required status checks must run on every pull request.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Everything, exactly as `pnpm check` runs it locally: TypeScript tests, generated-file
  # drift, composition, governance, and the router's fmt, clippy and unit tests.
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # breaking-changes compares against the target branch
      - uses: ./.github/actions/setup
      # Reads router/rust-toolchain.toml. hive-router's build script runs `npm install`,
      # which the Node setup above provides.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
          cache-workspaces: router
      - run: pnpm check

  # The governance checks again, one job each, so a failure names the check that failed
  # and branch protection can require them individually (see ADR 0007).
  composition:
    name: composition
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @federation-platform/governance run check:composition

  node-rules:
    name: node-rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @federation-platform/governance run check:node-rules

  operations:
    name: operations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @federation-platform/governance run check:operations

  breaking-changes:
    name: breaking-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm --filter @federation-platform/governance run check:breaking
        env:
          # On a pull request, the branch it will merge into; elsewhere the default (origin/main).
          GOVERNANCE_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}

  policy:
    name: policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @federation-platform/governance run check:policy

  decisions:
    name: decisions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm --filter @federation-platform/governance run check:decisions

  # The real stack: build the images (the router is a Rust build, so the layers are cached),
  # start docker compose, and run the scripts that talk to it.
  stack:
    name: stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: ./.github/actions/build-images
      - run: docker compose up -d --no-build --wait
      - run: node scripts/smoke.mjs
      - run: node scripts/request-id-check.mjs
      - run: node scripts/boundary-check.mjs
      - run: node scripts/rate-limit-cases.mjs
      - run: node scripts/rate-limit-reload.mjs
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  # Add a new Node type in another subgraph, run the update workflow, and resolve an
  # instance of it through the real router, with no hand edits to the node subgraph.
  add-node-type:
    name: add-node-type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/build-images
      - run: node e2e/add-node-type/run.mjs
      - if: failure()
        run: docker compose -f docker-compose.yml -f e2e/add-node-type/compose.gadgets.yml logs --no-color
