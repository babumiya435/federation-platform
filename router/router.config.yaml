# Router configuration. Limits and policy live in the supergraph, not here.

supergraph:
  source: file
  path: /app/supergraph.graphql
  # Re-read the file when it changes, so a recomposed supergraph goes live without a restart.
  poll_interval: 5s

# Forward the request id to every subgraph. The request_id plugin guarantees one exists.
headers:
  all:
    request:
      - propagate:
          named: x-request-id

jwt:
  enabled: true
  # Anonymous requests are allowed in; protected fields refuse them (ADR 0003).
  require_authentication: false
  jwks_providers:
    - source: file
      path: /app/auth/dev-jwks.json
  allowed_algorithms: ["ES256"]

authorization:
  directives:
    enabled: true
    unauthorized:
      mode: reject

plugins:
  request_id:
    enabled: true
    warn_on_error: false
  rate_limit:
    enabled: true
    # A plugin that fails to start must stop the router: running without it would
    # silently serve every limited field unprotected.
    warn_on_error: false
    config:
      max_buckets: 10000
