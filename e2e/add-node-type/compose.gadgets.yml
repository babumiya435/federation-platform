# Adds the throwaway gadgets subgraph to the stack. Used with docker-compose.yml:
#   docker compose -f docker-compose.yml -f e2e/add-node-type/compose.gadgets.yml up
services:
  gadgets:
    image: federation-platform/gadgets:local
    build:
      context: .
      dockerfile: docker/subgraph.Dockerfile
      args:
        PACKAGE: "@federation-platform/gadgets"
    environment:
      PORT: "4003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/graphql?query=%7B__typename%7D').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20

  router:
    depends_on:
      gadgets:
        condition: service_healthy
