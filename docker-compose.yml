# Every subgraph answers a trivial query on its own PORT; one definition serves them all.
x-subgraph-healthcheck: &subgraph-healthcheck
  test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/graphql?query=%7B__typename%7D').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 3s
  timeout: 3s
  retries: 20

services:
  product:
    image: federation-platform/product:local
    build:
      context: .
      dockerfile: docker/subgraph.Dockerfile
      args:
        PACKAGE: "@federation-platform/product"
    environment:
      PORT: "4001"
    healthcheck: *subgraph-healthcheck

  node:
    image: federation-platform/node:local
    build:
      context: .
      dockerfile: docker/subgraph.Dockerfile
      args:
        PACKAGE: "@federation-platform/node"
    environment:
      PORT: "4002"
    healthcheck: *subgraph-healthcheck

  router:
    image: federation-platform/router:local
    build:
      context: .
      dockerfile: docker/router.Dockerfile
    ports:
      - "${ROUTER_PORT:-4000}:4000"
    volumes:
      - ./supergraph:/app/supergraph:ro
      - ./auth/dev-jwks.json:/app/auth/dev-jwks.json:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/readiness"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      product:
        condition: service_healthy
      node:
        condition: service_healthy
