# Every subgraph answers a trivial query on its own PORT; one definition serves them all.
x-subgraph-healthcheck: &subgraph-healthcheck
  test: ["CMD", "node", "-e", "fetch('http://localhost:'+process.env.PORT+'/graphql?query=%7B__typename%7D').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
  interval: 3s
  timeout: 3s
  retries: 20

services:
  product:
    image: federation-platform/product:local
    build:
      context: .
      dockerfile: docker/subgraph.Dockerfile
      args:
        PACKAGE: "@federation-platform/product"
    environment:
      PORT: "4001"
    healthcheck: *subgraph-healthcheck

  reviews:
    image: federation-platform/reviews:local
    build:
      context: .
      dockerfile: docker/subgraph.Dockerfile
      args:
        PACKAGE: "@federation-platform/reviews"
    environment:
      PORT: "4004"
      # Reviews asks the product subgraph whether a product exists before adding a review for it.
      PRODUCT_SUBGRAPH_URL: http://product:4001/graphql
    healthcheck: *subgraph-healthcheck

  node:
    image: federation-platform/node:local
    build:
      context: .
      dockerfile: docker/subgraph.Dockerfile
      args:
        PACKAGE: "@federation-platform/node"
    environment:
      PORT: "4002"
      # The node subgraph learns which subgraphs own Node entities from the composed supergraph,
      # the same file the router follows. The folder is mounted so a replaced file is seen.
      SUPERGRAPH_PATH: /app/supergraph/supergraph.graphql
    volumes:
      - ./supergraph:/app/supergraph:ro
    healthcheck: *subgraph-healthcheck

  router:
    image: federation-platform/router:local
    build:
      context: .
      dockerfile: docker/router.Dockerfile
    ports:
      - "${ROUTER_PORT:-4000}:4000"
    volumes:
      - ./supergraph:/app/supergraph:ro
      - ./auth/dev-jwks.json:/app/auth/dev-jwks.json:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4000/readiness"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      product:
        condition: service_healthy
      reviews:
        condition: service_healthy
      node:
        condition: service_healthy
