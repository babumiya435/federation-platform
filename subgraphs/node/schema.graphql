extend schema @link(url: "https://specs.apollo.dev/federation/v2.9", import: ["@key", "@interfaceObject"])

# This subgraph knows no concrete types. `Node` here is an interface object: it stands for every
# type that implements Node anywhere in the graph, and the owning subgraphs say which type an id
# is. Adding an entity type elsewhere therefore never touches this file.
# See docs/decisions/0010-node-interface-object.md.
type Node @key(fields: "id") @interfaceObject {
  id: ID!
}

type Query {
  node(id: ID!): Node
}
