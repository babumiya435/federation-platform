extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.9", import: ["@key", "@requiresScopes", "@composeDirective"])
  @link(url: "https://platform.local/rate-limit/v1.0", import: ["@rateLimit"])
  @composeDirective(name: "@rateLimit")

directive @rateLimit(cost: Int! = 1, limit: Int!, windowSeconds: Int!) on FIELD_DEFINITION

interface Node
  @key(fields: "id")
{
  id: ID!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type Product implements Node
  @key(fields: "id")
{
  id: ID!
  name: String!
  price: Float!
  internalCost: Float! @requiresScopes(scopes: [["catalog:read:internal"]])
}

type Query {
  """All products, Relay-paginated."""
  products(before: String, after: String, first: Int, last: Int): QueryProductsConnection! @rateLimit(limit: 5, windowSeconds: 10)
}

type QueryProductsConnection {
  pageInfo: PageInfo!
  edges: [QueryProductsConnectionEdge!]!
}

type QueryProductsConnectionEdge {
  node: Product!
  cursor: String!
}
